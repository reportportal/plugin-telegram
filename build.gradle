plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.6.1'
    id "com.github.node-gradle.node" version "7.1.0"
    id("io.freefair.lombok") version "9.8.2"
}

node {
    version = '20.11.0'
    npmVersion = '10.2.4'
    download = true
    workDir = layout.buildDirectory.dir('ui').get().asFile
    npmWorkDir = layout.buildDirectory.dir('npm').get().asFile
    nodeProjectDir = file("${project.rootDir}/ui")
}

npm_run_build {
    inputs.files fileTree("ui/src")
    inputs.file 'ui/package.json'
    inputs.file 'ui/package-lock.json'
    outputs.dir 'ui/build'
}

apply from: 'project-properties.gradle'
apply from: scriptsUrl + '/release-fat.gradle'
apply from: scriptsUrl + '/signing.gradle'

repositories {
    mavenLocal()
    mavenCentral { url = "https://repo1.maven.org/maven2" }
    maven { url = "https://build.shibboleth.net/nexus/content/repositories/releases/" }
    if (!releaseMode) {
        maven { url = 'https://jitpack.io' }
    }
}

dependencies {
    if (releaseMode) {
        implementation 'com.epam.reportportal:service-api'
        annotationProcessor('com.epam.reportportal:service-api') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    } else {
        implementation 'com.github.reportportal:service-api:d4b2f7c'
        annotationProcessor('com.github.reportportal:service-api:d4b2f7c') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    }

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

assemble.dependsOn shadowJar

generatePomFileForShadowPublication { pom.packaging = "jar" }

sourceSets {
    main {
        resources
                {
                    exclude '**'
                }
    }
}

jar {
    from("src/main/resources") {
        into("/resources")
    }
    from("ui/build") {
        into("/resources")
    }
    manifest {
        attributes(
                "Class-Path": configurations.compileClasspath.collect { it.getName() }.join(' '),
                "Plugin-Id": "${pluginId}",
                "Plugin-Version": "${project.version}",
                "Plugin-Provider": "Report Portal",
                "Plugin-Class": "com.epam.reportportal.extension.telegram.TelegramPlugin",
                "Plugin-Service": "api"
        )
    }
}

tasks.register('generateMarketplaceManifest') {
    def outputDir = layout.buildDirectory.dir('generated/marketplace')
    def manifest = [
            id           : pluginId.toString().trim(),
            name         : 'Telegram',
            version      : project.version.toString(),
            description  : 'Send ReportPortal launch notifications to Telegram chats.',
            author       : [name: 'EPAM ReportPortal', email: 'support@reportportal.io'],
            license      : 'Apache-2.0',
            category     : 'notifications',
            compatibility: [reportportal: '>=25.1'],
            homepage     : 'https://github.com/reportportal/plugin-telegram',
            access       : 'public',
    ]
    inputs.property('manifest', manifest)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('marketplace-manifest.json').asFile
        file.parentFile.mkdirs()
        file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
    }
}

shadowJar {
    from(tasks.named('generateMarketplaceManifest'))
    from("src/main/resources") {
        into("/resources")
    }
    from("ui/build") {
        into("/resources")
    }
    configurations = [project.configurations.compileClasspath]
    zip64 = true
    dependencies {
        include(dependency('commons-io:commons-io:2.15.1'))
    }
}

def pluginZip = tasks.register('plugin', Jar) {
    getArchiveBaseName().set("plugin-${pluginId}")
    into('classes') {
        with jar
    }
    into('lib') {
        from configurations.compileClasspath
    }
    archiveExtension.set('zip')
}

tasks.register('assemblePlugin', Copy) {
    from pluginZip
    into pluginsDir
}

tasks.register('assemblePlugins', Copy) {
    dependsOn subprojects.assemblePlugin
}

compileJava.dependsOn npm_run_build
